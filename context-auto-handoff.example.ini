; context-auto-handoff 設定範例
; 複製到 <家目錄>\.claude\context-auto-handoff.ini 再改（Windows：C:\Users\<你>\.claude\）。
; 每次檢查都會重讀，改完下一輪就生效，不用重啟。存成 UTF-8（有沒有 BOM 都可以）；值照原樣寫，路徑的反斜線不用重複。
;
; 段落說明：
;   [handoff]  固定一段，放整體設定。
;   其他段落   每段是交接卡的一個大項，段落名稱＝大項的英文名稱，交接卡標題寫成「## 名稱」。
;              段落裡：desc = 這一項要寫什麼（給 Claude 看的說明，可不寫）
;                      checkItemDetail = 要檢查的子項（見下方）
;                      其他「名稱 = 說明」都是子項，交接卡寫成「- 名稱：內容」
;
; 寫 vs 檢查：
;   段落裡定義的大項、子項，Claude 都會照著寫進交接卡。
;   只有列在 checkItems / checkItemDetail 的才會被 mod 檢查（要有、而且有內容）。
;   沒列的照樣寫、只是不檢查——可以先定義很多項，只檢查其中幾項，不用的不必刪。
;   沒有 checkItems＝不檢查大項；大項裡沒有 checkItemDetail＝不檢查這個大項的子項。
;   沒寫的設定一律用預設值；INI 沒有任何大項段落時，用下面這組當預設。
;
; 固定檢查（不用設定）：交接卡要存在；第一個「##」前要有一行
;   「- project：<repo 專案名>（<VS Code 專案資料夾>）」，資料夾由 mod 告訴 Claude 並核對。

[handoff]
; context 用到幾 % 算滿（1～100，預設 60）
threshold = 60

; context 滿了之後什麼時候交接：now = 1, turnEnd = 2, nextMessage = 3
; 只能寫 1～3，寫錯或沒寫就用 2
contextFullTrigger = 2

; 交接卡裡怎麼稱呼你（預設「使用者」）
userName = 使用者

; 交接卡要放在這個資料夾裡面，mod 會檢查（沒寫就不限制）
; handoffDir = C:\Users\<你>\Documents\work\

; 整份交接卡最多幾個字（不算空白；0＝不限制；預設 500）；超過算不合格，要 Claude 精簡
maxChars = 500

; 交接卡不合格時，mod 自動提醒 Claude 重寫幾次（0 以上的整數，預設 3）
; 提醒完還是不合格：停止自動提醒，但工具保持鎖住、不清空對話，等你處理
; （你可以直接跟 Claude 說哪裡要改，或打 /handoff cancel 取消交接）
retryTimes = 3

; 要檢查的大項（逗號分隔）：交接卡要有「## 名稱」標題，底下有內容
; checkItems = startHere, readFirst, constraints, corrections, waitingOn

[startHere]
desc = ★ 先接這件
; 要檢查的子項（逗號分隔）：這個大項底下要有「- 名稱：內容」；沒寫這行就不檢查子項
; checkItemDetail = goal, taskFolder, stoppedAt, committed, uncommitted, nextSteps
goal = 主旨（{userName} 原話）
taskFolder = 任務資料夾
stoppedAt = 停在哪
committed = 已 commit
uncommitted = 未 commit
nextSteps = 接下來（依序）

[readFirst]
desc = 先讀（依序）

[constraints]
desc = 不可偏離／不做

[corrections]
desc = 跟 {userName} 互動（這次被指正的）

[waitingOn]
desc = 等 {userName} 一句話
